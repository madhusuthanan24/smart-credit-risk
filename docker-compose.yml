version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: credit_risk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credit_risk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_risk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: credit_risk_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/credit_risk
      SECRET_KEY: smart_credit_risk_secret_key_change_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FRONTEND_URL: http://localhost:3000,http://localhost:5173,http://localhost
      ENVIRONMENT: production
      MODEL_PATH: models/final_model.joblib
      PREPROCESSOR_PATH: models/preprocessing_pipeline.joblib
      THRESHOLD_PATH: models/threshold_config.json
      METADATA_PATH: models/final_model_metadata.json
    ports:
      - "8000:8000"
    networks:
      - credit_risk_net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: credit_risk_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - credit_risk_net
    depends_on:
      - backend

networks:
  credit_risk_net:
    driver: bridge

volumes:
  postgres_data:
