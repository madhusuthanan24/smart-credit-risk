version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: credit_risk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credit_risk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_risk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: credit_risk_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgrespassword@postgres:5432/credit_risk}
      SECRET_KEY: ${SECRET_KEY:-production_secret_key_must_have_at_least_32_characters_random}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://localhost:5173,http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MODEL_PATH: models/final_model.joblib
      PREPROCESSOR_PATH: models/preprocessing_pipeline.joblib
      THRESHOLD_PATH: models/threshold_config.json
      METADATA_PATH: models/final_model_metadata.json
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.2-11b-vision-instruct}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
    ports:
      - "8000:8000"
    networks:
      - credit_risk_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: credit_risk_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - credit_risk_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  credit_risk_net:
    driver: bridge

volumes:
  postgres_data:
